<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puzzle Cam — Gesture Capture</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">

  <div id="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="sceneCanvas"></canvas>

    <div class="hud-top">
      <div class="brand">PUZZLE·CAM <small>chụp bằng khung tay</small></div>
      <div class="status-pill">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">đang khởi động camera…</span>
      </div>
    </div>

    <div id="progressBadge" class="progress-badge">
      <span id="progressText">0 / 9 mảnh đã đặt</span>
    </div>

    <div id="loadingOverlay">
      <div class="loader-text" id="loaderText">đang tải mô hình HandLandmarker…</div>
      <div class="loader-bar"></div>
      <button type="button" id="loaderRetry" class="loader-retry hidden">thử lại</button>
    </div>

    <div id="errorBanner"></div>
  </div>

  <aside id="gallery">
    <div class="gallery-head">
      <span class="gallery-title">Dải ảnh</span>
      <span class="gallery-count" id="galleryCount">0 / 3</span>
    </div>

    <div class="strip-complete-msg" id="stripCompleteMsg">
      dải ảnh đã đầy — tải về hoặc reset để tiếp tục
    </div>

    <div id="galleryStrip" class="gallery-strip">
      <div class="gallery-empty" id="galleryEmpty">
        Các puzzle đã hoàn thành<br/>sẽ xuất hiện ở đây.
      </div>
    </div>

    <div class="gallery-actions">
      <button type="button" id="downloadStripBtn" class="gallery-action-btn" disabled>tải dải ảnh</button>
      <button type="button" id="resetAllBtn" class="gallery-action-btn gallery-action-btn--danger">reset tất cả</button>
    </div>
  </aside>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
