<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Puzzle·Cam — Camera điện thoại</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root{
    --ink:#0a0a08;
    --ink-soft:#15140f;
    --paper:#eae5d6;
    --signal:#f5c518;
    --signal-dim:#7a6312;
    --danger:#e0533d;
    --ok:#5fae6e;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100vw; min-height:100vh;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    overflow-x:hidden;
  }
  #wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    text-align:center;
    gap:18px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--signal-dim);
  }
  h1{
    font-size:22px;
    font-weight:650;
    margin:0;
    letter-spacing:-0.01em;
  }
  p.sub{
    font-size:13px;
    line-height:1.55;
    color:rgba(234,229,214,0.6);
    max-width:320px;
    margin:0;
  }
  #previewBox{
    position:relative;
    width:min(320px, 82vw);
    aspect-ratio:3/4;
    background:var(--ink-soft);
    border:1px solid rgba(234,229,214,0.14);
    border-radius:8px;
    overflow:hidden;
    display:none;
  }
  #previewBox.visible{ display:block; }
  video{
    width:100%; height:100%;
    object-fit:cover;
    transform:scaleX(-1);
  }
  .status-pill{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    padding:7px 13px;
    border-radius:2px;
    border:1px solid rgba(234,229,214,0.25);
    background:rgba(255,255,255,0.03);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--danger);
    box-shadow:0 0 6px var(--danger);
    flex-shrink:0;
  }
  .status-dot.live{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .status-dot.armed{ background:var(--signal); box-shadow:0 0 6px var(--signal); }

  button{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:14px 28px;
    border-radius:3px;
    border:1px solid var(--signal);
    background:var(--signal);
    color:#1a1400;
    cursor:pointer;
  }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  button.secondary{
    background:transparent;
    color:var(--paper);
    border-color:rgba(234,229,214,0.3);
    padding:10px 18px;
    font-size:11.5px;
  }
  .row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="eyebrow">PUZZLE·CAM · CAMERA RỜI</div>
    <h1 id="titleText">Biến điện thoại thành camera</h1>
    <p class="sub" id="subText">Nhấn nút bên dưới, cho phép dùng camera. Hình sẽ tự động gửi sang màn hình máy tính.</p>

    <div id="previewBox">
      <video id="localPreview" playsinline autoplay muted></video>
    </div>

    <div class="status-pill">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">chưa kết nối</span>
    </div>

    <div class="row">
      <button type="button" id="startBtn">bắt đầu camera</button>
      <button type="button" id="flipBtn" class="secondary hidden">đổi camera trước/sau</button>
    </div>
  </div>

<script>
(function () {
  const startBtn = document.getElementById("startBtn");
  const flipBtn = document.getElementById("flipBtn");
  const previewBox = document.getElementById("previewBox");
  const localPreview = document.getElementById("localPreview");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const titleText = document.getElementById("titleText");
  const subText = document.getElementById("subText");

  const params = new URLSearchParams(window.location.search);
  const targetPeerId = params.get("peer");

  let localStream = null;
  let currentFacing = "user";
  let peer = null;
  let activeCall = null;

  function setStatus(text, state) {
    statusText.textContent = text;
    statusDot.classList.remove("live", "armed");
    if (state) statusDot.classList.add(state);
  }

  if (!targetPeerId) {
    titleText.textContent = "Thiếu mã kết nối";
    subText.textContent = "Hãy quay lại màn hình máy tính và quét mã QR mới — link này cần có mã đi kèm.";
    startBtn.disabled = true;
    setStatus("không có mã kết nối", null);
    return;
  }

  if (typeof Peer === "undefined") {
    setStatus("không tải được thư viện kết nối", null);
    startBtn.disabled = true;
    return;
  }

  const isLocalhost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
  if (window.location.protocol !== "https:" && !isLocalhost) {
    titleText.textContent = "Trang chưa chạy qua HTTPS";
    subText.textContent =
      "iPhone chặn camera trên trang HTTP không an toàn. Nhờ người mở màn hình máy tính " +
      "chạy qua địa chỉ HTTPS thật (deploy lên Vercel/Netlify, hoặc dùng ngrok) rồi quét lại mã QR mới.";
    startBtn.disabled = true;
    setStatus("cần HTTPS để dùng camera", null);
    return;
  }

  async function getStream(facing) {
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
  }

  function callLaptop(stream) {
    if (!peer || peer.destroyed) return;
    if (activeCall) {
      activeCall.close();
      activeCall = null;
    }
    setStatus("đang gọi tới máy tính…", "armed");
    activeCall = peer.call(targetPeerId, stream);
    if (!activeCall) {
      setStatus("không gọi được — thử lại", null);
      return;
    }
    activeCall.on("close", () => setStatus("đã ngắt kết nối với máy tính", null));
    activeCall.on("error", (err) => {
      console.error("[PuzzleCam mobile] lỗi cuộc gọi:", err);
      setStatus("lỗi kết nối — thử lại", null);
    });
    // Không có cách trực tiếp để biết đầu bên kia đã "answer", nên coi
    // như đã kết nối ngay khi cuộc gọi được khởi tạo thành công trên LAN.
    setTimeout(() => {
      if (activeCall) {
        setStatus("đã kết nối với máy tính", "live");
      }
    }, 800);
  }

  async function start() {
    startBtn.disabled = true;
    setStatus("đang xin quyền camera…", "armed");
    try {
      localStream = await getStream(currentFacing);
    } catch (err) {
      console.error("[PuzzleCam mobile] lỗi camera:", err);
      setStatus("không lấy được camera — kiểm tra quyền truy cập", null);
      startBtn.disabled = false;
      return;
    }

    localPreview.srcObject = localStream;
    previewBox.classList.add("visible");
    flipBtn.classList.remove("hidden");
    startBtn.textContent = "đang chạy";
    setStatus("đang kết nối tới máy tính…", "armed");

    peer = new Peer();
    peer.on("open", () => callLaptop(localStream));
    peer.on("error", (err) => {
      console.error("[PuzzleCam mobile] lỗi PeerJS:", err);
      setStatus("lỗi kết nối (" + (err && err.type ? err.type : "?") + ")", null);
    });
  }

  async function flipCamera() {
    currentFacing = currentFacing === "user" ? "environment" : "user";
    flipBtn.disabled = true;
    try {
      const newStream = await getStream(currentFacing);
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
      }
      localStream = newStream;
      localPreview.srcObject = localStream;
      if (peer && !peer.destroyed) callLaptop(localStream);
    } catch (err) {
      console.error("[PuzzleCam mobile] lỗi đổi camera:", err);
      setStatus("không đổi được camera", null);
    } finally {
      flipBtn.disabled = false;
    }
  }

  startBtn.addEventListener("click", start);
  flipBtn.addEventListener("click", flipCamera);

  window.addEventListener("beforeunload", () => {
    if (localStream) localStream.getTracks().forEach((t) => t.stop());
    if (peer) peer.destroy();
  });
})();
</script>
</body>
</html>
